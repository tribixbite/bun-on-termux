# Global Bun Configuration for Termux
# C wrapper handles env vars natively; no preload needed.

[install]
# Exact versions to avoid dependency conflicts
exact = true
# NOTE: backend = "copyfile" is NOT a valid bunfig key (CLI-only flag).
# The shim intercepts link/linkat to handle this automatically.
# Registry configuration
registry = "https://registry.npmjs.org"

[install.cache]
dir = "~/.bun/install/cache"

[run]
# Use Termux's native shell for script execution
shell = "system"
